name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # 只安装 cmake 和 ninja（很小）
          sudo apt-get install -y cmake ninja-build
          # 下载 ARM 官方工具链（约 150MB，比 apt 的 600MB 小很多）
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
          tar -xf arm-gnu-toolchain-*.tar.xz
          echo "$(pwd)/arm-gnu-toolchain/bin" >> $GITHUB_PATH

      - name: Clone Pico SDK
        run: |
          git clone https://github.com/raspberrypi/pico-sdk.git $HOME/pico-sdk
          cd $HOME/pico-sdk && git submodule update --init lib/tinyusb

      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -G Ninja -DPICO_SDK_PATH=$HOME/pico-sdk
          ninja

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: usb_mouse
          path: build/usb_mouse.uf2
