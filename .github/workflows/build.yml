name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Check repository files
        run: |
          echo "===== Current directory ====="
          pwd

          echo "===== Files ====="
          ls -la

          echo "===== C files ====="
          find . -maxdepth 2 -name "*.c" -print



      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz

          tar -xf arm-gnu-toolchain-*.tar.xz

          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "arm-gnu-toolchain*" | head -1)

          echo "$(pwd)/$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH

          echo "PICO_TOOLCHAIN_PATH=$(pwd)/$TOOLCHAIN_DIR" >> $GITHUB_ENV



      - name: Clone Pico SDK
        run: |
          git clone https://github.com/raspberrypi/pico-sdk.git $HOME/pico-sdk

          cd $HOME/pico-sdk

          git submodule update --init lib/tinyusb



      - name: Build
        run: |
          mkdir build

          cd build

          cmake .. -G Ninja -DPICO_SDK_PATH=$HOME/pico-sdk

          ninja



      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: usb_mouse
          path: build/usb_mouse.uf2
