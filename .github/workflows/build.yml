name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          # 下载 ARM 官方工具链（约 150 MB）
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
          tar -xf arm-gnu-toolchain-*.tar.xz
          # 找到解压后的实际目录（可能是 arm-gnu-toolchain-13.2.rel1）
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "arm-gnu-toolchain*" | head -1)
          # 将 bin 目录加入 PATH
          echo "$(pwd)/$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH
          # 设置 PICO_TOOLCHAIN_PATH 以供 CMake 使用
          echo "PICO_TOOLCHAIN_PATH=$(pwd)/$TOOLCHAIN_DIR" >> $GITHUB_ENV

      - name: Clone Pico SDK
        run: |
          git clone https://github.com/raspberrypi/pico-sdk.git $HOME/pico-sdk
          cd $HOME/pico-sdk && git submodule update --init lib/tinyusb

      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -G Ninja -DPICO_SDK_PATH=$HOME/pico-sdk
          ninja

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: usb_mouse
          path: build/usb_mouse.uf2
